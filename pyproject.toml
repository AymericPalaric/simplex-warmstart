[project]
name = "simplex-warmstart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AymPal-FixPC", email = "pro.aympal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"