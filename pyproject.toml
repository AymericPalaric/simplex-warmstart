[project]
name = "simplex-warmstart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AymPal-FixPC", email = "pro.aympal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "mlflow>=3",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "pandera>=0.32.1",
    "pyarrow>=17,<25",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "artifact: nécessite models/model.pt (lancé après dvc repro)",
]
