name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -m "not artifact"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Reproduce the pipeline
        run: uv run dvc repro --force

      - name: Tests sur l'artefact
        run: uv run pytest -m artifact

      - name: Rapport du gate
        if: always()
        run: cat metrics/gate.json

      - name: Show metrics
        run: cat metrics/eval.json

      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/

      - name: Build report
        if: always() && github.event_name == 'pull_request'
        run: uv run python scripts/report.py --base "origin/${{ github.base_ref }}"

      - name: Post report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
        run: |
          gh pr comment "$PR" --body-file report.md --edit-last \
            || gh pr comment "$PR" --body-file report.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: simplex-warmstart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm simplex-warmstart:ci \
            python -c "import simplex_warmstart.serving.app; print('import ok')"
