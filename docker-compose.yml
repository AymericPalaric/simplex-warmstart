services:
  tools:
    build: .
    profiles: [ "tools" ]
    depends_on: [ mlflow ]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /workspace/src
  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////data/mlflow.db --serve-artifacts --artifacts-destination /data/mlartifacts --allowed-hosts mlflow:*,localhost:*,127.0.0.1:*,mlflow,localhost,127.0.0.1
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/data
    user: root

  api:
    build: .
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/simplex-warmstart@champion
    ports:
      - "8000:8000"

volumes:
  mlflow-data:
