data:
  batch_id: 0
  n_studies: 120
  seed: 0
  families: [esters, silicones]

split:
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 17

model:
  hidden: [96, 96]
  dropout: 0.0

train:
  epochs: 150
  batch_size: 256
  lr: 0.01
  weight_decay: 0.0001
  seed: 42
  augment_permutations: true

gates:
  max_test_rmse: 0.19
  min_test_r2: 0.90
  max_family_rmse_gap: 0.1

registry:
  model_name: simplex-warmstart
  promotion_margin: 0.005
