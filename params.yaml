data:
  batches:
  - id: 0
    n_studies: 120
    seed: 0
    families: [esters, silicones]
    protocol: v1
  - id: 1
    n_studies: 80
    seed: 1001
    families:
    - esters
    - silicones

split:
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 17

model:
  hidden: [64, 64]
  dropout: 0.0

train:
  epochs: 100
  batch_size: 256
  lr: 0.01
  weight_decay: 0.0001
  seed: 42
  augment_permutations: true

gates:
  max_test_rmse: 0.19
  min_test_r2: 0.90
  max_family_rmse_gap: 0.1

drift:
  psi_threshold: 0.2
  share_threshold: 0.4

registry:
  model_name: simplex-warmstart
  promotion_margin: 0.005
